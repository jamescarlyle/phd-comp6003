# config-neat-hopper.ini
# NEAT configuration for Hopper-v5 (MuJoCo continuous control)
# Used by env_hopper.py / run_hopper.py
#
# Hopper is a medium-high complexity continuous control task.
# Key differences from CartPole / LunarLander:
#   - Continuous 3-dimensional action space (joint torques, clipped to [-1, 1])
#   - 11-dimensional observation space
#   - Episodes are naturally shorter than LunarLander due to fall termination
#   - Reward signal is dense (forward velocity + alive bonus - control cost)
#   - Larger population and longer stagnation tolerance than CartPole
#
# Reference: https://neat-python.readthedocs.io/en/latest/config_file.html

[NEAT]

# Fitness is evaluated as the maximum across the population.
fitness_criterion        = max

# Training stops when any genome reaches this cumulative reward.
# Hopper "solved" threshold is typically ~3000-3800 per episode;
# we set 2500 as a reasonable target for evolved (non-gradient) networks.
fitness_threshold        = 2500

# Population size. Hopper has 11 inputs and 3 outputs — a medium-complexity
# problem. 200 gives good coverage of the search space without being
# prohibitively slow when each episode runs for up to 1000 steps.
pop_size                 = 200

# Restart the population from scratch if all species die out.
reset_on_extinction      = True

# Do not terminate early on reaching the threshold (keep evolving to build
# a robust policy across non-stationary conditions).
no_fitness_termination   = False


[DefaultGenome]

# ── Structural mutation ───────────────────────────────────────────────────────

# Allow only one structural mutation per genome per generation.
# Keeps evolutionary steps small and avoids destabilising working topologies.
single_structural_mutation   = True

# If True, NEAT retries a failed structural mutation until it succeeds.
structural_mutation_surer    = default

# ── Initialisation types ─────────────────────────────────────────────────────

bias_init_type               = gaussian
response_init_type           = gaussian
weight_init_type             = gaussian

# ── Connection enable/disable toggling ───────────────────────────────────────

enabled_rate_to_true_add     = 0.0
enabled_rate_to_false_add    = 0.0

# ── Network dimensions ───────────────────────────────────────────────────────

# Hopper-v5 observation: z, torso angle, 3 joint angles, x vel, z vel,
#   torso ang vel, 3 joint ang vels  →  11 inputs.
num_inputs               = 11

# Three joint torques (thigh, leg, foot)  →  3 outputs.
num_outputs              = 3

# Start with no hidden nodes; NEAT grows them via node_add_prob.
num_hidden               = 0

# Fully connected initial network (all input→output connections present).
# Gives every genome a complete baseline policy to refine from.
initial_connection       = full_direct

feed_forward             = True

# ── Activation functions ─────────────────────────────────────────────────────

# tanh is the default: bounded, smooth, and well-suited to continuous outputs.
activation_default       = tanh

# Allow occasional mutation to sigmoid or relu to explore richer dynamics.
activation_mutate_rate   = 0.01
activation_options       = tanh sigmoid relu

# ── Aggregation ──────────────────────────────────────────────────────────────

aggregation_default      = sum
aggregation_mutate_rate  = 0.0
aggregation_options      = sum

# ── Bias ─────────────────────────────────────────────────────────────────────

bias_init_mean           = 0.0
bias_init_stdev          = 0.8

# Wide clamp gives NEAT room to express strong biases if needed.
bias_max_value           = 30.0
bias_min_value           = -30.0

# Conservative mutate power: small incremental changes preferred over jumps.
bias_mutate_power        = 0.2
bias_mutate_rate         = 0.25
bias_replace_rate        = 0.03

# ── Response ─────────────────────────────────────────────────────────────────

# Response scales node output: output = activation(response * aggregated_input)
# Kept fixed at 1.0 (effectively disabled) to reduce the search space.
response_init_mean       = 1.0
response_init_stdev      = 0.0
response_max_value       = 30.0
response_min_value       = -30.0
response_mutate_power    = 0.0
response_mutate_rate     = 0.0
response_replace_rate    = 0.0

# ── Weights ──────────────────────────────────────────────────────────────────

weight_init_mean         = 0.0
weight_init_stdev        = 0.8

weight_max_value         = 30.0
weight_min_value         = -30.0

# Conservative perturbations: Hopper is sensitive to weight instabilities.
weight_mutate_power      = 0.2
weight_mutate_rate       = 0.3
weight_replace_rate      = 0.03

# ── Connection enable/disable ─────────────────────────────────────────────────

enabled_default          = True

# Very low enable-toggle rate to preserve working connection patterns.
enabled_mutate_rate      = 0.003

# ── Structural mutation rates ─────────────────────────────────────────────────

# Low add rates for stability; deletion rates reduced to near-zero to prevent
# topology collapse into the alive-bonus trap (degenerate stand-still networks).
conn_add_prob            = 0.03
conn_delete_prob         = 0.03

node_add_prob            = 0.1
node_delete_prob         = 0.001

# ── Speciation (compatibility distance) ──────────────────────────────────────
#
# Distance formula: d = (c1*E + c2*D) / N  +  c3 * W
#   E = excess genes, D = disjoint genes, W = avg weight difference of matches
#   N = max genome size (normaliser; set to 1 if N < 20)

# Higher disjoint coefficient to enforce tighter species boundaries;
# structural diversity is important for a complex locomotion task.
compatibility_disjoint_coefficient = 1.5
compatibility_weight_coefficient   = 1.0


[DefaultSpeciesSet]

# Species threshold: genomes within this distance share a species.
# 3.5 is moderately permissive — allows structural variants to coexist
# without fragmenting into too many single-genome species.
compatibility_threshold  = 3.5


[DefaultStagnation]

# A species' fitness is measured by its best member's score.
species_fitness_func     = max

# Allow 20 generations of no improvement before culling a species.
# Higher than CartPole (15) because Hopper fitness landscapes are noisier
# and a species may genuinely need more time to find a working gait.
max_stagnation           = 20

# Always preserve the two best species, regardless of stagnation.
species_elitism          = 2


[DefaultReproduction]

# Top 4 genomes in each species are carried forward unchanged (elitism).
elitism                  = 4

# Top 30% of each species reproduce; the rest are culled.
survival_threshold       = 0.3

# Species cannot shrink below 2 members.
min_species_size         = 2